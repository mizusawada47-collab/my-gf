<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Dhafny</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Caveat:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#17101f;--ink:#fff4f6;--serif:'Young Serif',Georgia,serif;--hand:'Caveat',cursive;--sans:'Figtree',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);transition:background .8s,color .8s;overflow-x:hidden}
  .screen{display:none;min-height:100svh;padding:24px;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
  .screen.active{display:flex;animation:fade .7s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  h1,h2{font-family:var(--serif);font-weight:400;line-height:1.15}
  h1{font-size:clamp(1.9rem,7vw,3.2rem)}
  input[type=text],textarea{width:min(92vw,420px);font:inherit;font-size:1.1rem;padding:14px 16px;border-radius:12px;border:2px solid currentColor;background:transparent;color:inherit}
  textarea{min-height:200px;resize:vertical;font-family:var(--hand);font-size:1.6rem;line-height:1.3}
  ::placeholder{color:inherit;opacity:.55}
  .btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:13px 28px;font:600 1rem var(--sans);cursor:pointer}
  .btn:hover{opacity:.85}
  :focus-visible{outline:3px solid #ffd29a;outline-offset:3px}
  .msg{min-height:1.5em;font-size:.95rem}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  .swatches{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:340px}
  .sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);cursor:pointer}
  input[type=color]{width:84px;height:84px;border:0;background:none;cursor:pointer}

  .book{position:relative;width:min(88vw,400px);height:min(68svh,540px);perspective:1400px}
  .paper{position:absolute;inset:0;background:#fff7f2;color:#2a1a2e;border-radius:4px 14px 14px 4px;border-left:12px solid #5a2340;
    box-shadow:0 18px 40px rgba(0,0,0,.35);transform-origin:left center;transition:transform .26s ease-in}
  .paper.turn{transform:rotateY(-80deg)}
  #pageContent{height:100%;overflow-y:auto;padding:26px 24px 46px;text-align:left;font-family:var(--hand);font-size:1.55rem;line-height:1.3;white-space:pre-line}
  #pageContent img{width:80%;display:block;margin:0 auto 14px;border-radius:4px;transform:rotate(-2deg);box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .ph{width:80%;margin:0 auto 14px;aspect-ratio:4/5;background:#e9dcff;display:grid;place-items:center;font-size:1.2rem;border-radius:4px}
  #pageNum{position:absolute;bottom:12px;width:100%;text-align:center;font:.85rem var(--sans);opacity:.55}
  .cover{position:absolute;inset:0;z-index:2;border:0;cursor:pointer;background:#5a2340;color:#ffd29a;border-radius:4px 14px 14px 4px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:var(--serif);font-size:2rem;
    outline:2px solid #ffd29a;outline-offset:-16px;box-shadow:0 18px 40px rgba(0,0,0,.4);
    transform-origin:left center;transition:transform 1.3s ease,opacity 1.3s}
  .cover small{font:700 1.5rem var(--hand)}
  .book.open .cover{transform:rotateY(-125deg);opacity:0;pointer-events:none}
  .nav{display:flex;gap:14px;opacity:0;pointer-events:none;transition:opacity .6s .8s}
  .book.open + .nav{opacity:1;pointer-events:auto}
  #mute{position:fixed;top:14px;right:14px;background:none;border:2px solid currentColor;color:inherit;border-radius:50%;width:44px;height:44px;font-size:1.2rem;cursor:pointer}

  .chant{font-family:var(--hand);font-size:clamp(2rem,8vw,3rem);font-weight:700;opacity:0;animation:pop .6s forwards}
  .chant:nth-of-type(1){animation-delay:.8s}.chant:nth-of-type(2){animation-delay:1.4s}
  .chant:nth-of-type(3){animation-delay:2s}.chant:nth-of-type(4){animation-delay:2.6s}
  @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<audio id="song" src="song.mp3" loop preload="auto"></audio>

<!-- 1. LOCK -->
<main class="screen active" id="lock">
  <h1>Enter Mizu's fav color<br>to unlock this website</h1>
  <input type="text" id="ans" placeholder="Type a color" autocomplete="off" aria-label="Favorite color">
  <button class="btn" id="unlock">Unlock</button>
  <p class="msg" id="lockMsg" role="status"></p>
</main>

<!-- 2. PICK COLOR -->
<main class="screen" id="pick">
  <h1>Pick any color you want</h1>
  <input type="color" id="colorInput" value="#ff8fa3" aria-label="Pick a color">
  <div class="swatches" id="swatches"></div>
  <button class="btn" id="colorDone">I choose this one</button>
</main>

<!-- 3. BOOK -->
<main class="screen" id="bookScreen">
  <button id="mute" aria-label="Mute or unmute song">🔊</button>
  <div class="book" id="book">
    <button class="cover" id="cover" aria-label="Open the book">For Dhafny<small>tap to open</small></button>
    <div class="paper" id="paper"><div id="pageContent"></div><div id="pageNum"></div></div>
  </div>
  <div class="nav">
    <button class="btn" id="prev">Back</button>
    <button class="btn" id="next">Next page</button>
  </div>
</main>

<!-- 4. MESSAGE FOR MIZU -->
<main class="screen" id="message">
  <h1>A message for Mizu</h1>
  <textarea id="msgBox" placeholder="Write something for me..." aria-label="Your message"></textarea>
  <button class="btn" id="send">Send</button>
  <p class="msg" id="sendMsg" role="status"></p>
</main>

<!-- 5. FINAL -->
<main class="screen" id="final">
  <h1>HAPPY 23rd MONTHSARY<br>FOR BOTH OF YOU</h1>
  <p class="chant">iiyot na yan!</p>
  <p class="chant">iiyot na yan!</p>
  <p class="chant">iiyot na yan!</p>
  <p class="chant">iiyot na yan!</p>
</main>

<script>
/* ============ SETTINGS ============ */
const CONFIG = {
  FORM_ENDPOINT: "",   // example: "https://formspree.io/f/abcdwxyz"
  EMAIL: "",           // fallback, example: "you@gmail.com"
  PHOTO: "photo.jpg"   // photo on the last book page
};

const PAGES = [
{ text:`Hi, my sweet gorgeous Dhafny

Today is our kuan, ayna seg English uy boang. HAPPY HAPPY 23rd monthsary po, baby. wa jud ko nag expect nga maabot ta ani kataas do. well, ana gani sila ayaw expect aron di ma dissapoint and look wala ko nag expect wala sad ko na dissapoint WAHHHHH...` },

{ text:`Sorry baby if usahay masuko ko sa imoha, di gud nako iingon nga suko ko but halata ba and kahibaw ko nga mali na sya behavior, behaviour, personality, attitude or basta kanang batasan gud. Sorry baby kay usahay ginapikon tika, ganahan gud ko masuko ka HAHAHAHAA idk why but arghh gusto ko mapikon ka do.` },

{ text:`23rd monthsary na nato hon, isa nalang mag 2nd anniversary na ta yeyyyy!! birthday nimo then gap ra one week kay anniversary nato WAHHHHHH.. idk unsa ako eprepare ana, shetyy kaayo but kaning gibuhat nako kay friday afternoon ra ko nag sugod maong gamay ra kaayo sya.` },

{ text:`Sorry baby po if mao ra ni akong ma hatag sa imoha, kahibaw man ko ba enough na ni for you but I wish I could do better than this. mubawi ra ko sunod po baby po. ALWAYD TIKA LOVEEEE bisa'g bida bida ka mu mid. you'll be my forever dark system partner and always tika love bisa'g you can't beat me sa roblox kasi you're so so weaklings` },

{ text:`I LOVE YOU ALWAYS POOO BABYYY AND HAPPY HAPPYYY 23RD MONTHSARY SA ATOA PO. hope mag stay healthy atong relationship. bisa'g busy ta unta walay mag change sa atong, bisa'g naa gud but strong ra gihapon ta dapat. ana ra, ug please baby stay healthy sad, di ra atong rs but dapat kita sad duha. kana bang muingon ka naa kay gibati do kay sisihon lagi nako na akong kaugalingon kay alangan nag ingana ka tungod kay nalimot kag kaon, wa kay gana mukaon, or late ka mukaon and matug tungod na sa akoa` },

{ text:`So if dika gusto sisihon nako akong kaugalingon then help yourself sad baby po and ang pinaka big thing nga akong isorry sa imoha is kana gud kapoy kas school or need nimog comfort kay wala koy ginabuhat do,  dili na tungod kay wala koy pake, wala ra jud ko kahibaw asa mag start or unsa ang iingon or buhaton.` },

{ text:`HAPPY HAPPY 23rd MONTHSARY again po, babyyyy!! I love you more than anything else po, take care of yourself always and stay gorgeous my sweet baby!` },

{ photo:true, text:`I LOVE YOUUUU, MY POPPY POLLY POOKIE NAMI BABY HONEY DAUFEIJIU DHAFNY  DUBIDUBIDAPDAP AND NGGANYNYYY!!` }
];
/* ================================== */

const $ = id => document.getElementById(id);
const go = id => { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); window.scrollTo(0,0); };

/* 1. lock: "black" (or "itom") unlocks */
let wrong = 0;
function tryUnlock(){
  const a = $('ans').value.trim().toLowerCase();
  if (a === 'black' || a === 'itom'){ go('pick'); return; }
  wrong++;
  $('lockMsg').textContent = wrong >= 3 ? "Still not it. Hint: dark, like our dark system 🖤" : "That's not it. Try again.";
  const i = $('ans'); i.classList.remove('shake'); void i.offsetWidth; i.classList.add('shake');
}
$('unlock').onclick = tryUnlock;
$('ans').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

/* 2. color picker: chosen color becomes the background */
function applyColor(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const light = (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6;
  document.documentElement.style.setProperty('--bg', hex);
  document.documentElement.style.setProperty('--ink', light ? '#1d1126' : '#fff4f6');
}
['#ff8fa3','#ffb36b','#ffe066','#7be0a0','#6ec6ff','#b79bff','#ff6ec7','#ffffff'].forEach(c => {
  const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.setAttribute('aria-label', c);
  b.onclick = () => { $('colorInput').value = c; applyColor(c); };
  $('swatches').appendChild(b);
});
$('colorInput').addEventListener('input', e => applyColor(e.target.value));
$('colorDone').onclick = () => go('bookScreen');

/* 3. book */
let cur = 0;
function render(){
  const p = PAGES[cur], box = $('pageContent');
  box.innerHTML = '';
  if (p.photo){
    const img = new Image(); img.alt = 'Us'; img.src = CONFIG.PHOTO;
    img.onerror = () => { const d = document.createElement('div'); d.className = 'ph'; d.textContent = 'Add ' + CONFIG.PHOTO; img.replaceWith(d); };
    box.appendChild(img);
  }
  const t = document.createElement('p'); t.textContent = p.text; box.appendChild(t);
  box.scrollTop = 0;
  $('pageNum').textContent = (cur + 1) + ' / ' + PAGES.length;
  $('prev').style.visibility = cur ? 'visible' : 'hidden';
  $('next').textContent = cur === PAGES.length - 1 ? 'Close the book' : 'Next page';
}
function turn(d){
  const paper = $('paper'); paper.classList.add('turn');
  setTimeout(() => { cur += d; render(); paper.classList.remove('turn'); }, 260);
}
const song = $('song');
$('cover').onclick = () => { $('book').classList.add('open'); song.volume = 1; song.play().catch(()=>{}); };
$('prev').onclick = () => { if (cur > 0) turn(-1); };
$('next').onclick = () => cur === PAGES.length - 1 ? closeBook() : turn(1);
$('mute').onclick = () => { song.muted = !song.muted; $('mute').textContent = song.muted ? '🔇' : '🔊'; };
function closeBook(){
  $('book').classList.remove('open');
  const fade = setInterval(() => { song.volume = Math.max(0, song.volume - .08); if (song.volume <= 0){ song.pause(); clearInterval(fade); } }, 120);
  setTimeout(() => { go('message'); }, 1400);
}
render();

/* 4. message for Mizu */
$('send').onclick = async () => {
  const text = $('msgBox').value.trim();
  if (!text){ $('sendMsg').textContent = "Write something first."; return; }
  $('send').disabled = true; $('sendMsg').textContent = "Sending...";
  try {
    if (CONFIG.FORM_ENDPOINT){
      const r = await fetch(CONFIG.FORM_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify({ message: text }) });
      if (!r.ok) throw new Error('send failed');
    } else if (CONFIG.EMAIL){
      location.href = 'mailto:' + CONFIG.EMAIL + '?subject=' + encodeURIComponent('A message for Mizu') + '&body=' + encodeURIComponent(text);
    }
    go('final');
  } catch (e){
    $('send').disabled = false; $('sendMsg').textContent = "It didn't send. Check your connection and try again.";
  }
};
</script>
</body>
  </html>
